name: secret-scan

# Fails when a commit adds a credential the scanner can confirm is live. Test fixtures use public
# Anvil keys and placeholders, which never verify.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --only-verified
