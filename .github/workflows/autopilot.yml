name: autopilot

on:
  push:
    paths: ["apps/autopilot/**", "packages/autopilot/**", "packages/perpl/**", "packages/chain/**", "packages/contracts-ts/**", "backend/src/db/migrations/**", "apps/relayer/test/**", ".github/workflows/autopilot.yml"]
  pull_request:
    paths: ["apps/autopilot/**", "packages/autopilot/**", "packages/perpl/**", "packages/chain/**", "packages/contracts-ts/**", "backend/src/db/migrations/**", "apps/relayer/test/**", ".github/workflows/autopilot.yml"]
  workflow_dispatch:

concurrency:
  group: autopilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trendr
          POSTGRES_PASSWORD: trendr
          POSTGRES_DB: trendr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trendr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://trendr:trendr@localhost:5432/trendr_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: ./.github/actions/install-packages
      - name: Rule engine package
        working-directory: packages/autopilot
        run: |
          bunx tsc --noEmit
          bun test
      - name: Install (the tests reuse the relayer's account flow helpers)
        run: |
          (cd apps/relayer && bun install --frozen-lockfile)
          (cd apps/autopilot && bun install --frozen-lockfile)
      - name: Typecheck
        working-directory: apps/autopilot
        run: bunx tsc --noEmit
      - name: Tests
        working-directory: apps/autopilot
        run: bun run test
