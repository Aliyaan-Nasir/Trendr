name: indexer

on:
  push:
    paths: ["indexer/**", ".github/workflows/indexer.yml"]
  pull_request:
    paths: ["indexer/**", ".github/workflows/indexer.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: indexer

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Uses the pnpm version pinned in indexer/package.json (packageManager).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: indexer/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
          cache-dependency-path: indexer/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Codegen
        run: pnpm codegen
      - name: Typecheck
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      # Simulated events against an in-memory store: no HyperSync token, network or database needed.
      - name: Tests
        run: pnpm test
