name: cre-oracle

on:
  push:
    paths: ["apps/cre-oracle/**", "contracts/test/fixtures/**", ".github/workflows/cre-oracle.yml"]
  pull_request:
    paths: ["apps/cre-oracle/**", "contracts/test/fixtures/**", ".github/workflows/cre-oracle.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/cre-oracle/attention-index

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit and workflow tests
        run: bun test
