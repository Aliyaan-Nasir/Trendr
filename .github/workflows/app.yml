name: app

on:
  push:
    paths: ["frontend/**", "apps/relayer/**", "packages/**", "contracts/src/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["frontend/**", "apps/relayer/**", "packages/**", "contracts/src/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: ./.github/actions/install-packages
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Install shared package and relayer
        run: |
          (cd packages/contracts-ts && bun install --frozen-lockfile)
          (cd apps/relayer && bun install --frozen-lockfile)
      - name: Install app
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npx eslint .
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build contracts (tests deploy and read every artifact)
        working-directory: contracts
        run: forge build
      - name: Browser end to end (passkey accounts on Anvil)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
