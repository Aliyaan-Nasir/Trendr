# Logical secret ids mapped to environment variables (.env in simulation, the Vault DON when deployed).
# Leave a variable empty to disable its source.
secretsNames:
  ELFA_API_KEY:
    - CRE_ELFA_API_KEY
  REDDIT_CLIENT_ID:
    - CRE_REDDIT_CLIENT_ID
  REDDIT_CLIENT_SECRET:
    - CRE_REDDIT_CLIENT_SECRET
  NANSEN_API_KEY:
    - CRE_NANSEN_API_KEY
  # The backend's ORACLE_TOKEN, for its candidate queue and collector.
  BACKEND_TOKEN:
    - CRE_BACKEND_TOKEN
